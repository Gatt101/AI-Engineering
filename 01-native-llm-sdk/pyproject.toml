[project]
name = "research-sdk"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi[standard]>=0.162,<0.163", "openai>=3.40,<4", "pydantic-settings>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
